site_name: LazyAlpha Research
site_description: Honest, documented backtests of LazyAlpha's systematic trading strategy research -- context, cited sources, and full results, including failures.
site_url: https://selvaz.github.io/LazyAlphaWeb/
repo_url: https://github.com/selvaz/LazyAlphaWeb
repo_name: selvaz/LazyAlphaWeb
docs_dir: docs

theme:
  name: material
  palette:
    scheme: default
    primary: deep purple
    accent: deep purple
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Methodology: methodology.md
