site_name: LazyAlpha Research
site_description: Honest, documented backtests of LazyAlpha's systematic trading strategy research -- context, cited sources, and full results, including failures.
site_url: https://selvaz.github.io/LazyAlphaWeb/
repo_url: https://github.com/selvaz/LazyAlphaWeb
repo_name: selvaz/LazyAlphaWeb
docs_dir: docs

theme:
  name: material
  palette:
    scheme: default
    primary: deep purple
    accent: deep purple
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Leaderboard: leaderboard.md
  - Changelog: changelog.md
  - Notes: notes.md
  - Models:
      - 'ma_crossover_50_200': models/ma-crossover-50-200.md
      - 'ma_crossover_5_20': models/ma-crossover-5-20.md
      - 'policy_conditional_ma_50_200_6m': models/policy-conditional-ma-50-200-6m.md
      - 'regime_conditional_ma_50_200_state_0': models/regime-conditional-ma-50-200-state-0.md
      - 'sentiment_conditional_ma_50_200_3d': models/sentiment-conditional-ma-50-200-3d.md
      - 'turtle_systems_1_and_2': models/turtle-systems-1-and-2.md
      - 'volatility_managed_ma_crossover_50_200': models/volatility-managed-ma-crossover-50-200.md
